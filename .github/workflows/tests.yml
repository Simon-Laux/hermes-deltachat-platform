name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # what Hermes runs on
      # Hermes itself is mocked in tests/conftest.py; aiortc/numpy are for the call tests
      - run: pip install pytest pytest-asyncio aiortc numpy
      # The slow WebRTC loopback tests are excluded by tests/pytest.ini (`-m "not slow"`)
      - run: python -m pytest tests/
        env:
          PYTHONPATH: .
